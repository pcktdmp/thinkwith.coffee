{{- if hugo.IsProduction | or (eq site.Params.env "production") }}
<div id="cookie-consent-banner" class="cookie-consent" hidden>
    <div class="cookie-consent-text">
        <p id="cookie-consent-message">This site uses cookies for analytics and to show ads. See the <a href="/privacy-policy/">privacy policy</a> for details.</p>
    </div>
    <div class="cookie-consent-actions">
        <button id="cookie-consent-reject" type="button" class="cookie-consent-btn cookie-consent-btn-secondary">Reject<span class="cookie-consent-check" hidden> &check;</span></button>
        <button id="cookie-consent-accept" type="button" class="cookie-consent-btn cookie-consent-btn-primary">Accept<span class="cookie-consent-check" hidden> &check;</span></button>
    </div>
</div>
<button id="cookie-consent-settings" type="button" class="cookie-consent-settings-link" hidden>Cookie settings</button>

<script>
(function () {
    var CONSENT_KEY = "cookie-consent";
    var GA_ID = {{ site.Params.googleAnalyticsID | jsonify }};
    var ADS_CLIENT = {{ site.Params.adsenseClientID | jsonify }};
    var CONFIRM_DELAY = 900;

    function loadAnalytics() {
        if (!GA_ID || window.__gaLoaded) return;
        window.__gaLoaded = true;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", GA_ID);
    }

    function loadAds() {
        if (!ADS_CLIENT || window.__adsLoaded) return;
        window.__adsLoaded = true;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + ADS_CLIENT;
        s.crossOrigin = "anonymous";
        document.head.appendChild(s);
    }

    function applyConsent(value) {
        if (value === "accepted") {
            loadAnalytics();
            loadAds();
        }
    }

    var banner = document.getElementById("cookie-consent-banner");
    var message = document.getElementById("cookie-consent-message");
    var settingsBtn = document.getElementById("cookie-consent-settings");
    var acceptBtn = document.getElementById("cookie-consent-accept");
    var rejectBtn = document.getElementById("cookie-consent-reject");
    var acceptCheck = acceptBtn.querySelector(".cookie-consent-check");
    var rejectCheck = rejectBtn.querySelector(".cookie-consent-check");
    var defaultMessage = message.textContent;

    // Reflects the stored choice onto the button that was actually
    // clicked, rather than a separate status line.
    function markChosenButton(value) {
        acceptBtn.classList.remove("is-active");
        rejectBtn.classList.remove("is-active");
        acceptCheck.hidden = true;
        rejectCheck.hidden = true;
        if (value === "accepted") {
            acceptBtn.classList.add("is-active");
            acceptCheck.hidden = false;
        } else if (value === "rejected") {
            rejectBtn.classList.add("is-active");
            rejectCheck.hidden = false;
        }
    }

    function showBanner() {
        message.textContent = defaultMessage;
        banner.classList.remove("is-leaving");
        banner.hidden = false;
        markChosenButton(localStorage.getItem(CONSENT_KEY));
    }

    function hideBanner() {
        banner.hidden = true;
        banner.classList.remove("is-leaving");
        settingsBtn.hidden = false;
    }

    // Gives visible confirmation of the click (message swap, button
    // checkmark) before the banner fades out, instead of vanishing
    // the instant a button is pressed.
    function confirmAndClose(value) {
        markChosenButton(value);
        message.textContent = value === "accepted"
            ? "Saved: cookies accepted. Change this anytime via “Cookie settings”."
            : "Saved: cookies rejected. Change this anytime via “Cookie settings”.";
        setTimeout(function () {
            banner.classList.add("is-leaving");
            setTimeout(hideBanner, 250);
        }, CONFIRM_DELAY);
    }

    var stored = localStorage.getItem(CONSENT_KEY);
    if (stored) {
        applyConsent(stored);
        settingsBtn.hidden = false;
    } else {
        showBanner();
    }

    acceptBtn.addEventListener("click", function () {
        localStorage.setItem(CONSENT_KEY, "accepted");
        applyConsent("accepted");
        confirmAndClose("accepted");
    });

    rejectBtn.addEventListener("click", function () {
        localStorage.setItem(CONSENT_KEY, "rejected");
        confirmAndClose("rejected");
    });

    settingsBtn.addEventListener("click", function () {
        settingsBtn.hidden = true;
        showBanner();
    });
})();
</script>
{{- end }}
